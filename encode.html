<!doctype html>
<html><head><meta charset="utf-8"><title>encode</title></head>
<body style="background:#222;color:#eee;font-family:monospace">
<div id="status">idle</div>
<canvas id="cv"></canvas>
<script>
const JOBS = [
  { src:"/assets/video/pizza-new.mp4", out:"pizza-preview", start:4, dur:10, posterAt:16 }
];
const status = document.getElementById("status");
window.__enc = {};

function pickType(){
  const cands = [
    "video/mp4;codecs=avc1.42E01E",
    "video/mp4",
    "video/webm;codecs=vp9",
    "video/webm;codecs=vp8",
    "video/webm"
  ];
  for (const c of cands) if (MediaRecorder.isTypeSupported(c)) return c;
  return null;
}

async function encodeOne(job, mime){
  const v = document.createElement("video");
  v.src = job.src; v.muted = true; v.playsInline = true;
  await new Promise((res,rej)=>{ v.onloadedmetadata = res; v.onerror = ()=>rej(new Error("load fail")); });
  const W = v.videoWidth, H = v.videoHeight;
  const cv = document.getElementById("cv"); cv.width = 540; cv.height = Math.round(540 * H / W);
  const ctx = cv.getContext("2d");
  v.currentTime = Math.min(job.start, Math.max(0, v.duration - job.dur));
  await new Promise(res => v.onseeked = res);
  const stream = v.captureStream();
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 900000 });
  const chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  const done = new Promise(res => rec.onstop = res);
  await v.play(); rec.start(250);
  await new Promise(res => { const t0 = v.currentTime; const iv = setInterval(() => { if (v.currentTime - t0 >= job.dur) { clearInterval(iv); res(); } }, 200); });
  rec.stop(); v.pause();
  await done;
  const blob = new Blob(chunks, { type: mime.split(";")[0] });
  const fr = new FileReader();
  const dataUrl = await new Promise(res => { fr.onload = ()=>res(fr.result); fr.readAsDataURL(blob); });
  window.__enc[job.out] = dataUrl;
  if (job.posterAt !== undefined) {
    v.currentTime = job.posterAt;
    await new Promise(res => v.onseeked = res);
    ctx.drawImage(v, 0, 0, cv.width, cv.height);
    window.__enc[job.out + "-poster"] = cv.toDataURL("image/jpeg", 0.8);
  }
  return { size: blob.size, w: W, h: H };
}

(async()=>{
  const mime = pickType();
  if (!mime) { status.textContent = "ERROR no MediaRecorder type"; return; }
  const results = {};
  for (const j of JOBS) {
    status.textContent = "encoding " + j.out + " (" + mime + ")…";
    results[j.out] = await encodeOne(j, mime);
  }
  window.__mime = mime;
  status.textContent = "DONE " + mime + " " + JSON.stringify(results);
})().catch(e => status.textContent = "ERROR " + e.message);
</script>
</body></html>
