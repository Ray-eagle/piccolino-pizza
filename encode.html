<!doctype html>
<html><head><meta charset="utf-8"><title>encode</title></head>
<body style="background:#222;color:#eee;font-family:monospace">
<div id="status">idle</div>
<canvas id="cv"></canvas>
<script>
const JOBS = [
  { src:"/assets/video/pizza-burger.mp4", out:"pizza-burger-preview", start:29, dur:10 },
  { src:"/assets/video/quality.mp4", out:"quality-preview", start:0, dur:8 }
];
const status = document.getElementById("status");
window.__enc = {};

function pickType(){
  const cands = [
    "video/mp4;codecs=avc1.42E01E",
    "video/mp4",
    "video/webm;codecs=vp9",
    "video/webm;codecs=vp8",
    "video/webm"
  ];
  for (const c of cands) if (MediaRecorder.isTypeSupported(c)) return c;
  return null;
}

async function encodeOne(job, mime){
  const v = document.createElement("video");
  v.src = job.src; v.muted = true; v.playsInline = true;
  await new Promise((res,rej)=>{ v.onloadedmetadata = res; v.onerror = ()=>rej(new Error("load fail")); });
  const W = 540, H = Math.round(540 * v.videoHeight / v.videoWidth);
  const cv = document.getElementById("cv"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  v.currentTime = Math.min(job.start, Math.max(0, v.duration - job.dur));
  await new Promise(res => v.onseeked = res);
  const stream = cv.captureStream(30);
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 1400000 });
  const chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  const done = new Promise(res => rec.onstop = res);
  let raf;
  const draw = () => { ctx.drawImage(v, 0, 0, W, H); raf = requestAnimationFrame(draw); };
  await v.play(); draw(); rec.start(250);
  await new Promise(res => setTimeout(res, job.dur * 1000));
  rec.stop(); v.pause(); cancelAnimationFrame(raf);
  await done;
  const blob = new Blob(chunks, { type: mime.split(";")[0] });
  const fr = new FileReader();
  const dataUrl = await new Promise(res => { fr.onload = ()=>res(fr.result); fr.readAsDataURL(blob); });
  window.__enc[job.out] = dataUrl;
  return { size: blob.size, w: W, h: H };
}

(async()=>{
  const mime = pickType();
  if (!mime) { status.textContent = "ERROR no MediaRecorder type"; return; }
  const results = {};
  for (const j of JOBS) {
    status.textContent = "encoding " + j.out + " (" + mime + ")…";
    results[j.out] = await encodeOne(j, mime);
  }
  window.__mime = mime;
  status.textContent = "DONE " + mime + " " + JSON.stringify(results);
})().catch(e => status.textContent = "ERROR " + e.message);
</script>
</body></html>
